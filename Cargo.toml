[package]
name = "hyprforge-settings"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Settings app for Hyprforge: an iced GUI over Hyprland's config, appearance, displays, network, Bluetooth, shortcuts and more."
repository = "https://github.com/hyprforge-suite/hyprforge"
documentation = "https://docs.rs/hyprforge-settings"
readme = "README.md"
keywords = ["hyprland", "settings", "gui", "wayland", "linux"]
categories = ["gui", "os::linux-apis"]

[[bin]]
name = "hyprforge-settings"
path = "src/main.rs"

[dependencies]
# Named as git dependencies, not versions, because the owner has not
# published to crates.io yet: this manifest has to work unchanged both
# inside the Hyprforge workspace and as the root of its own standalone
# repository once `git subtree split` pulls it out. Inside the
# workspace, the root Cargo.toml's `[patch]` section redirects these
# straight back to the local `crates/` directories, so nothing here
# touches the network; standalone, cargo fetches them from git.
#
# This is the hub of the suite — repo-plan.md puts it last to split for
# exactly this reason: seventeen Hyprforge crates, not one or two.
#
# default-features = false, features = ["dbus"]: hyprforge-core's `dbus`
# (zbus) support is optional and only the settings app, displayctl and
# the tray want it — see the root workspace table's own comment on this
# crate.
hyprforge-core = { git = "https://github.com/hyprforge-suite/hyprforge", default-features = false, features = ["dbus"] }
hyprforge-ui = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-windowrules = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-input = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-appearance = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-look = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-paths = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-ecosystem = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-session = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-system = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-shortcuts = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-lua-import = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-network = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-bluetooth = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-power = { git = "https://github.com/hyprforge-suite/hyprforge" }
hyprforge-tray = { git = "https://github.com/hyprforge-suite/hyprforge" }
# What opens what: the freedesktop mime database, read and (for the
# user's own defaults) written. Same git spelling as every sibling
# above — see the comment at the top of this section.
hyprforge-mime = { git = "https://github.com/hyprforge-suite/hyprforge" }
# iced_graphics enables the `image` crate with no format features at all,
# so without this there is no PNG decoder and every wallpaper fails to
# load. Cargo unifies features across the dependency graph, so declaring
# the formats here is what switches them on for iced.
#
# The full list, matching the workspace root's, and kept matching by
# `check.sh`'s "Standalone crate dependency pins" step — which is what
# caught it when the root gained the rest of the decoders for the image
# viewer. Inside this workspace unification means this crate builds with
# them regardless; the list is what the standalone repository gets, and
# a wallpaper picker that cannot show a .webp thumbnail would be a
# strange thing to ship.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "tiff",
    "bmp",
    "ico",
    "tga",
    "qoi",
    "pnm",
    "hdr",
    "exr",
    "ff",
] }
async-trait = "0.1"
# `web-colors` is in iced's own default features and is the reason the
# Settings app and the greeter once drew the same theme in visibly
# different colours — it skips the sRGB->linear conversion on the wgpu
# path, so a colour that reaches an sRGB surface gets encoded twice. See
# CLAUDE.md and the root workspace table's comment on this dependency.
# default-features = false with exactly this feature list is load
# bearing; do not add `web-colors` back. "canvas" and "tokio" are on top
# of the workspace base: "canvas" is used by the layout editor, "tokio"
# selects iced's tokio executor backend, which is what provides
# `iced::time::every` (used for the revert countdown) — the app already
# runs on tokio for its D-Bus work, so this aligns the two rather than
# adding a second runtime.
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
    "canvas",
    "tokio",
] }
# Run zbus on tokio rather than its default async-io executor. Without
# this zbus polls connections on its own thread, so D-Bus method handlers
# execute outside any tokio runtime and anything they spawn panics with
# "there is no reactor running".
zbus = { version = "5.18", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "process" for the hyprctl calls that float/pin the revert prompt (and
# focus the window on a second invocation's handoff); "net" and
# "io-util" for the control socket in `ipc.rs`
# (`UnixListener`/`UnixStream`, `BufReader`, `AsyncBufReadExt`/
# `AsyncWriteExt`) — the same set `hyprforge-clipboard`'s control socket
# needs, on top of the base rt-multi-thread/macros/sync/time this crate
# already needs everywhere else.
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "net",
    "io-util",
] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# The control socket's own error types (`ipc::IpcError`, `ipc::ClientError`)
# — the same crate `hyprforge-clipboard`'s and `notif-ipc`'s equivalents use.
thiserror = "2"

[dev-dependencies]
tempfile = "3"
# "mock" for `hyprforge_network::backend::mock::MockBackend`, which the
# Network screen's tests drive instead of a real D-Bus connection.
hyprforge-network = { git = "https://github.com/hyprforge-suite/hyprforge", features = ["mock"] }
# "mock" for `hyprforge_bluetooth::backend::mock::MockBackend`, which the
# Bluetooth screen's tests drive instead of a real D-Bus connection.
hyprforge-bluetooth = { git = "https://github.com/hyprforge-suite/hyprforge", features = ["mock"] }
# "mock" for `hyprforge_power::backend::mock`'s three mock backends, which
# the Power screen's tests drive instead of real D-Bus connections — and,
# for the power-profiles-daemon mock in particular, instead of ever
# touching the real one (see CLAUDE.md: never change the active profile
# of the machine this suite is developed on).
hyprforge-power = { git = "https://github.com/hyprforge-suite/hyprforge", features = ["mock"] }
# `test-util` for `#[tokio::test(start_paused = true)]`: the displayd call
# bounds are 5s and 25s, and a test suite must not spend half a minute
# actually waiting them out to prove they fire.
tokio = { version = "1.53", features = ["test-util", "macros", "rt"] }
