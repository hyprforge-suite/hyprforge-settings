# CI for the standalone hyprforge-settings repository (this file only
# takes effect at `.github/workflows/ci.yml` — the path `./split.sh`
# produces once `crates/hyprforge-settings` becomes a repository root).
#
# What this checks: that the crate builds, that clippy is silent (a
# clippy warning is a build failure in Hyprforge — see the upstream
# CLAUDE.md's "Clippy must be silent" rule), and the unit/integration
# test suite. Unlike hyprforge-clipboard, hyprforge-lock and
# hyprforge-tray, this crate has no `#[ignore]`d live tests to skip —
# there simply are none, so `cargo test` here is not a reduced tier, it
# is the whole suite (285 tests as of this writing).
#
# What this deliberately does NOT check, and must never claim to:
#   - it never runs the `hyprforge-settings` binary. Not once, not with
#     any flag, and never against a real `$HOME`. This is the app that
#     edits `hyprland.lua` and writes real config for a dozen other
#     Hyprforge components to read — see this crate's README and the
#     upstream CLAUDE.md's "Run the Settings app against an isolated
#     `XDG_CONFIG_HOME`" rule. A CI runner has no compositor, no
#     NetworkManager, no BlueZ and no real desktop session for it to
#     configure, and even if it did, launching a GUI settings app from a
#     workflow is not what this tier is for.
#   - it never touches a real NetworkManager or BlueZ. The Network and
#     Bluetooth screens' own tests drive
#     `hyprforge_network::backend::mock::MockBackend` and
#     `hyprforge_bluetooth::backend::mock::MockBackend` instead (see the
#     `mock`-featured dev-dependencies in Cargo.toml) — those crates'
#     own live tiers cover the real services, each gated on the service
#     it actually asks, not on whether this crate's tests happen to run.
#   - it never writes to a real `~/.config` or `/var/lib/hyprforge`.
#     Every test that touches config (window rules, shortcuts, network,
#     bluetooth, appearance, session, input, desktop) repoints
#     `$XDG_CONFIG_HOME` — and, where a save also republishes the shared
#     theme, `HYPRFORGE_GREET_DIR` — at a throwaway `tempfile::tempdir()`
#     first. See `modules::CONFIG_ENV_LOCK` for why that repointing is
#     serialized across every module's tests rather than one lock per
#     module.
#
# A green run means "the code is internally consistent". It does not
# mean "this app correctly edits a real Hyprland session" — that is
# exactly the gap manual testing against an isolated `XDG_CONFIG_HOME`
# (see the README) exists to close, the same way the monorepo's tier 2
# and tier 3 exist because tier 1 can't ask those questions either.

name: CI

on:
  push:
  pull_request:

jobs:
  tier-1:
    name: "Tier 1 (no compositor, no D-Bus services, no real $HOME): build, clippy -D warnings, cargo test"
    runs-on: ubuntu-latest
    env:
      # Cargo fetches git dependencies with libgit2, which does not honour
      # the `url.<..>.insteadOf` rewrite the step below installs — so the
      # credential never reaches the clone and the build fails with
      # "failed to authenticate", even though `git` itself would succeed.
      # Cargo says as much in that error, and this is the setting it
      # names: fetch with the git CLI instead, which does honour it.
      #
      # Goes with the SUITE_READ step below: when the suite repository
      # becomes public, both stop being necessary.
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Let cargo fetch the suite while it is still a private repository
        # This crate's Cargo.toml takes hyprforge-* as git dependencies on
        # the suite repository. While that repository is PRIVATE, the
        # built-in GITHUB_TOKEN cannot read it: an Actions token is scoped
        # to the repository the workflow runs in, and says nothing about
        # any other private repository in the same account. Cargo's fetch
        # then fails with "failed to authenticate when downloading
        # repository", which reads like a code problem and is not one.
        #
        # SUITE_READ is a fine-grained token with read-only Contents on
        # the suite repository and nothing else. `insteadOf` rewrites the
        # https:// URL cargo is about to clone so the credential is
        # attached without the manifests naming a token anywhere.
        #
        # This whole step is scaffolding for the private phase. The day
        # the suite repository becomes public, delete it and delete the
        # secret: a public repository is fetched anonymously and this
        # stops being necessary. If CI starts failing with that same
        # authentication error for no apparent reason, the likeliest
        # cause is the token having expired.
        #
        # An `extraheader` rather than a credential in the URL. The URL
        # form was tried first and GitHub answered "Invalid username or
        # token": credentials reached it and were refused, because
        # `x-access-token:<pat>` is the shape of a GitHub App
        # installation token, not of a personal access token. This is
        # the same basic-auth header `actions/checkout` sets for itself,
        # which is the one form known to work for both.
        #
        # The token arrives as an environment variable rather than being
        # interpolated into the script, so it is never part of the
        # command line a failing step would echo.
        env:
          SUITE_READ: ${{ secrets.SUITE_READ }}
        run: |
          git config --global http."https://github.com/".extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SUITE_READ" | base64 -w0)"

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        # ubuntu-latest ships rustup already; `rustup show` is what
        # makes it notice rust-toolchain.toml in this directory and
        # install exactly the channel and components (clippy, rustfmt)
        # that file pins, rather than whatever `stable` resolves to on
        # the day the job happens to run.
        #
        # What follows is why this crate once needed no apt-get step at
        # all, and it still holds for everything except one thing: since
        # hyprforge-tray took its popup in as a second binary, the tray
        # library brings hyprforge-popup and its xkbcommon-linking
        # smithay-client-toolkit with it — see "Install native
        # dependencies" below. This crate pulls the full iced/wgpu
        # stack plus zbus, mlua and a dozen Hyprforge crates, which
        # looks like it should need a pile of dev packages — it
        # doesn't, at *build* time:
        #   - zbus is a pure-Rust D-Bus implementation; it never links
        #     libdbus.
        #   - `mlua` is taken with the `vendored` feature (see the root
        #     workspace table's comment on it), so it compiles its own
        #     bundled Lua sources with `cc` rather than linking a system
        #     Lua — `cargo metadata`'s resolve graph for this crate
        #     shows `mlua-sys` as the only Linux-relevant crate with a
        #     `links = "lua"` key, and vendoring is exactly what makes
        #     that not require `liblua5.4-dev`.
        #   - iced's Wayland backend pulls in `smithay-client-toolkit`,
        #     but only with its `calloop` / `calloop-wayland-source`
        #     features on — not its own default `xkbcommon` feature,
        #     which is the one whose build script calls
        #     `pkg_config::Config::new().find("xkbcommon")` and needs
        #     `libxkbcommon-dev` (that's what `hyprforge-lock` needs it
        #     for, via `smithay-client-toolkit = "0.20"` naming that
        #     feature directly — verified by comparing
        #     `cargo tree -p hyprforge-settings -e features` against
        #     that crate's manifest). Keyboard handling here goes
        #     through `xkbcommon-dl`, which is dlopen-based and needs no
        #     dev package.
        #   - the runtime-only system libraries this app actually talks
        #     to at runtime (NetworkManager, BlueZ, a Wayland
        #     compositor) are all D-Bus or Wayland-socket connections
        #     resolved at runtime, not linked at build time, so they
        #     need no headers here either.
        run: rustup show

      - name: Cache the cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install native dependencies
        # hyprforge-tray pulls in hyprforge-popup, whose smithay-client-toolkit links libxkbcommon, and
        # its Wayland client links libwayland — confirmed with `cargo tree
        # -e features -i`, not assumed. The popup came in when the tray's
        # right-click menu moved into the tray crate as a second binary;
        # until this step existed, every run from that commit on failed
        # in smithay-client-toolkit's build script, before any of this
        # repository's code compiled.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libxkbcommon-dev libwayland-dev

      - name: cargo build
        run: cargo build --all-targets

      - name: cargo clippy --all-targets -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: "cargo test (the whole suite is tier 1 here — the Settings app binary is never run, and no test touches a real $HOME, NetworkManager or BlueZ)"
        run: cargo test --all-targets
